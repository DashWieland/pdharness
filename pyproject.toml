[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdharness"
version = "0.1.0"
description = "Bring your own agent: an MCP server and knowledge bank for building Pure Data instruments you can hear."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Dash Wieland" }]
dependencies = [
  "mcp>=1.20",
  "numpy>=1.22",
  # The three pieces of the harness.  None is on PyPI yet; pdbuild needs the
  # py2pd fork (Patcher geometry, add_comment, lossless to_builder, floatatom
  # field order), so all three are pinned to git.  See README "Install".
  "py2pd @ git+https://github.com/DashWieland/py2pd@fix/floatatom-fields-and-comments",
  "pdverify @ git+https://github.com/DashWieland/pdverify@main",
  "pdbuild @ git+https://github.com/DashWieland/pdbuild@main",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdharness = "pdharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdharness = ["knowledge/**/*"]
